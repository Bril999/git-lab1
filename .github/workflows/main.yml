
name: UART CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build UART project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GCC version
        run: gcc --version

      - name: Compile UART project
        run: gcc -Wall -Wextra main.c uart.c uart_diag.c -o uart_app

      - name: Run UART application
        run: ./uart_app

  test:
    name: UART unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile unit tests
        run: gcc -Wall -Wextra -Werror test_uart.c uart.c uart_diag.c -o test_uart

      - name: Run unit tests
        run: ./test_uart

  docs:
    name: Generate UART documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate HTML documentation
        run: doxygen Doxyfile

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: uart-api-docs
          path: docs/html/
          if-no-files-found: error
